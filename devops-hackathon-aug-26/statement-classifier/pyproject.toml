[project]
name = "statement-classifier"
version = "0.1.0"
description = "Classifies statements as fact or opinion, given their surrounding context, using an LLM via LangChain + OpenRouter."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    "pydantic>=2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
]
